<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pasteur Constant — Services temporairement suspendus</title>
  <meta name="description" content="Suite à des engagements associatifs, le Pasteur Constant suspend temporairement ses services privés. Contact en cas d'urgence : info@reverend.be">
  <meta name="robots" content="noindex">
  <link rel="canonical" href="https://www.reverend.be/" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400&family=Inter:wght@300;400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
  <style>
    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0;
      padding: 40px 24px;
      background:
        radial-gradient(ellipse at top right, rgba(212, 201, 168, 0.25) 0%, transparent 60%),
        radial-gradient(ellipse at bottom left, rgba(184, 154, 86, 0.08) 0%, transparent 50%),
        var(--bg, #FAFAF7);
      color: var(--ink, #162338);
      font-family: 'Inter', sans-serif;
    }
    .notice {
      max-width: 640px;
      text-align: center;
    }
    .notice-ornament {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 16px;
      margin-bottom: 28px;
      color: var(--gold, #B89A56);
      font-size: 12px;
      font-weight: 500;
      letter-spacing: 0.2em;
      text-transform: uppercase;
    }
    .notice-ornament span {
      display: block;
      width: 40px;
      height: 1px;
      background: var(--gold, #B89A56);
    }
    .notice h1 {
      font-family: 'Cormorant Garamond', serif;
      font-weight: 500;
      font-size: clamp(36px, 5vw, 56px);
      line-height: 1.1;
      margin: 0 0 32px;
    }
    .notice p {
      font-family: 'Cormorant Garamond', serif;
      font-size: clamp(20px, 2.4vw, 24px);
      line-height: 1.5;
      color: var(--ink-soft, #4A5468);
      margin: 0 0 20px;
    }
    .notice a {
      color: var(--gold-dark, #97804A);
      text-decoration: none;
      border-bottom: 1px solid var(--gold-pale, #D4C9A8);
    }
    .notice a:hover { color: var(--ink, #162338); }
  </style>
</head>
<body>
  <main class="notice">
    <div class="notice-ornament"><span></span>Pasteur Constant<span></span></div>
    <h1>Services temporairement suspendus</h1>
    <p>Suite à des engagements associatifs, je suspends temporairement mes services privés.</p>
    <p>En cas d'urgence, je reste joignable par mail à <a href="mailto:info@reverend.be">info@reverend.be</a>.</p>
  </main>
</body>
</html>
